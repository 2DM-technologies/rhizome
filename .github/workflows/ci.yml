name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  check:
    name: Deterministic repository check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rhizome

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rhizome_m1_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rhizome_m1_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rhizome_m1_test
      RHIZOME_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rhizome_m1_test

    steps:
      - name: Check out Rhizome
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: rhizome
          persist-credentials: false

      - name: Check out the pinned rNet types dependency
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: 2DM-technologies/rnet
          ref: e913807eb89035ce5629ef883661ad7f46adb2e6
          path: rnet
          ssh-key: ${{ secrets.RNET_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Cache Bun package downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.10-${{ hashFiles('rhizome/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply test database migrations
        run: bun run db:migrate

      - name: Run deterministic repository checks
        run: bun run check

  browser:
    name: Host Playwright suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rhizome

    steps:
      - name: Check out Rhizome
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: rhizome
          persist-credentials: false

      - name: Check out the pinned rNet types dependency
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: 2DM-technologies/rnet
          ref: e913807eb89035ce5629ef883661ad7f46adb2e6
          path: rnet
          ssh-key: ${{ secrets.RNET_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0

      - name: Cache Bun package downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.3.10-${{ hashFiles('rhizome/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium and its runtime dependencies
        run: bunx --no-install playwright install --with-deps chromium
        working-directory: rhizome/apps/host

      - name: Run host browser tests
        run: bun run test:e2e

      - name: Upload browser diagnostics
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: rhizome/.rhizome/playwright
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
